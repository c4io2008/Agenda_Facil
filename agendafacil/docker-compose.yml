services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: agendafacil
      POSTGRES_PASSWORD: agendafacil
      POSTGRES_DB: agendafacil
    ports: ["54329:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agendafacil"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://agendafacil:agendafacil@db:5432/agendafacil
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      JWT_EXPIRES_IN: 2h
      WHATSAPP_API_TOKEN: ${WHATSAPP_API_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_RETRY_MINUTOS: 5
      LEMBRETE_ANTECEDENCIA_HORAS: 24
      TOLERANCIA_DIAS_ATRASO: 5
      PAGAMENTOS_PROVIDER: fake
      PAGAMENTOS_API_KEY: ${PAGAMENTOS_API_KEY:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
      CORS_ORIGIN: ${APP_PUBLIC_URL:-http://localhost:3000}
      PORT: 3333
    ports: ["3333:3333"]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3333/api/v1}
    depends_on: [backend]
    ports: ["3000:3000"]

volumes:
  pgdata:
